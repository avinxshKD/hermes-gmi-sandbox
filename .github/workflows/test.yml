name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: plugin
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: NousResearch/hermes-agent
          ref: 18ac1d528f36face9eb0b108cd9668f10b29c589
          path: hermes-core
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/requirements.txt
      - run: python scripts/test.py --hermes ../hermes-core -q
      - run: python scripts/validate.py --hermes ../hermes-core
      - run: ruff check __init__.py provider.py environment.py tests scripts
